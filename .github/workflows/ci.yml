name: Agentic DevOps
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash .ci/run.sh build

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash .ci/run.sh test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash .ci/run.sh lint

  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash .ci/run.sh sonar

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: sonar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash .ci/run.sh integration-test

  ui-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: integration-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash .ci/run.sh ui-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: demo-frontend/test-results/
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: ui-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash .ci/run.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: demo-release
          path: artifacts/

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash .ci/run.sh deploy
