services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: example-db-password
      MYSQL_ROOT_PASSWORD: example-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  demo-app:
    build: ./demo-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/demo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_APP_PORT:-8080}:8080"
  demo-frontend:
    build: ./demo-frontend
    depends_on:
      - demo-app
    ports:
      - "127.0.0.1:5173:80"
  demo-python:
    build: ./demo-python
    volumes:
      - product-data:/data
    ports:
      - "127.0.0.1:${DEMO_PYTHON_PORT:-8000}:8000"

volumes:
  mysql-data:
  product-data:
